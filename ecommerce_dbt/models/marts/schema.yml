version: 2

models:
  - name: fact_orders
    columns:
      - name: order_id
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id

  - name: dim_products
    columns:
      - name: product_id
        tests:
          - not_null
          - unique

  - name: customer_features
    description: "Customer-level aggregated features for ML segmentation."
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique

      - name: total_orders
        tests:
          - not_null

      - name: total_revenue
        tests:
          - not_null

      - name: recency_days
        tests:
          - not_null
